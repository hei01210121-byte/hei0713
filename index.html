<main><aside class="panel"><h2>CSV 파일 열기</h2><p>위도와 경도가 있는 CSV 파일을 선택하세요. 파일은 브라우저에서 처리됩니다.</p>
<div class="drop" id="drop"><button class="primary" id="choose">CSV 선택</button><small>또는 여기에 파일을 끌어 놓으세요</small><input type="file" id="file" accept=".csv,text/csv" hidden></div>
<button id="example" class="example">예제 데이터 보기</button>
<button id="featured" class="primary example">한수원 사업소·주변지역 보기</button>
<div id="layers" hidden style="margin-top:13px">
  <label style="display:block"><input id="plants" type="checkbox" checked> 사업소 <span style="color:#ac4b20">●</span></label>

  <p>주변지역은 행정구역 중심점으로 표시합니다. <a href="https://github.com/swuhalee/korea-regions-with-coords">행정구역 좌표</a> · <a href="https://github.com/wri/global-power-plant-database">발전소 좌표</a></p>
</div>
<p style="margin-bottom:0"><a href="./khnp-locations.csv" download>위치 CSV 다운로드</a> · <a href="./khnp-map.html" download>지도 HTML 다운로드</a></p>

<section class="locations" id="locations" hidden><input type="search" id="search" aria-label="위치 검색" placeholder="위치 이름 검색"><ul id="list" aria-label="위치 목록"></ul><small id="limit"></small></section></aside>
<section class="map-panel" aria-label="위치 지도"><div class="map-head"><h2>지도</h2><button id="fit" disabled>전체 위치 보기</button></div><div id="map" aria-label="위치 지도"></div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const get = id => document.getElementById(id);
function parseCsv(source) {
  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < source.length; i++) {
    const char = source[i];
    if (quoted) {
      if (char === '"' && source[i + 1] === '"') { field += '"'; i++; }
      else if (char === '"') quoted = false;
      else field += char;
    } else if (char === '"' && !field) quoted = true;
    else if (char === ',') { row.push(field); field = ''; }
    else if (char === '\n' || char === '\r') {
      if (char === '\r' && source[i + 1] === '\n') i++;
      row.push(field);
      if (row.some(value => value.trim())) rows.push(row);
      row = []; field = '';
    } else field += char;
  }
  if (quoted) throw new Error('CSV에서 닫히지 않은 따옴표를 확인하세요.');
  row.push(field);
  if (row.some(value => value.trim())) rows.push(row);
  return rows;
}
function coordinates(row, latIndex, lngIndex) {
  const latitude = row[latIndex]?.trim(), longitude = row[lngIndex]?.trim();
  const lat = Number(latitude), lng = Number(longitude);
  if (latitude && longitude && Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return [lat, lng];
}
let map, layer, rows = [], positions = [], filename = '', request = 0;
function status(message, error = false) {
  get('status').textContent = message;
  get('status').classList.toggle('error', error);
}
if (window.L) {
  map = L.map('map', {preferCanvas:true}).setView([36.35,127.8],7);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  layer = L.featureGroup().addTo(map);
} else {
  get('map').textContent = '지도 라이브러리에 연결할 수 없습니다. 인터넷 연결을 확인한 뒤 새로고침하세요.';
}
function fit() {
  if (layer?.getLayers().length) map.fitBounds(layer.getBounds(), {padding:[30,30], maxZoom:14});
}
function listLocations() {
  const query = get('search').value.trim().toLocaleLowerCase();
  const filtered = positions.filter(point => (point.label + ' ' + (point.detail || '')).toLocaleLowerCase().includes(query));
  const items = filtered.slice(0, 100).map(point => {
    const item = document.createElement('li'), button = document.createElement('button');
    const detail = document.createElement('small');
    button.className = 'row';
    button.textContent = point.label;
    detail.textContent = point.detail || point.coords.map(value => value.toFixed(5)).join(', ');
    button.append(detail);
    button.disabled = !map;
    button.onclick = () => { map.setView(point.coords, Math.max(map.getZoom(), 13)); point.marker.openPopup(); };
    item.append(button);
    return item;
  });
  get('list').replaceChildren(...items);
  get('limit').textContent = !filtered.length ? '검색 결과가 없습니다.' : filtered.length > 100 ? filtered.length.toLocaleString() + '개 중 처음 100개 표시' : '';
}
function redraw() {
  layer?.clearLayers();
  positions = [];
  const lat = Number(get('lat').value), lng = Number(get('lng').value), name = Number(get('name').value);
  if (lat < 0 || lng < 0 || lat === lng) {
    status('서로 다른 위도와 경도 열을 선택하세요.', true);
  } else {
    for (const [index, row] of rows.entries()) {
      const coords = coordinates(row, lat, lng);
      if (!coords) continue;
      const label = row[name]?.trim() || '위치 ' + (index + 1);
      const popup = document.createElement('div');
      popup.textContent = label + ' · ' + coords.join(', ');
      const marker = layer ? L.circleMarker(coords, {radius:7,color:'#fff',weight:2,fillColor:'#087969',fillOpacity:1}).bindPopup(popup).addTo(layer) : null;
      positions.push({coords, label, marker});
    }
    const skipped = rows.length - positions.length;
    status(filename + ' · ' + positions.length.toLocaleString() + '개 위치' + (skipped ? ' · 좌표 오류 ' + skipped.toLocaleString() + '행 제외' : ''), !positions.length);
  }
  get('locations').hidden = !positions.length;
  get('fit').disabled = !positions.length || !map;
  listLocations();
  fit();
}
function load(source, title) {
  const [headers, ...data] = parseCsv(source.replace(/^\uFEFF/, ''));
  if (!headers || headers.length < 2 || !data.length) throw new Error('열 이름과 두 개 이상의 열, 데이터 행이 있는 CSV가 필요합니다.');
  get('layers').hidden = true;
  rows = data;
  filename = title;
  const aliases = {lat:['lat','latitude','위도','위도deg','y'],lng:['lng','lon','long','longitude','경도','경도deg','x'],name:['name','title','label','장소','이름','장소명','명칭','지점명']};
  for (const id of Object.keys(aliases)) {
    const select = get(id);
    select.replaceChildren(new Option(id === 'name' ? '자동 번호' : '열 선택', '-1'));
    headers.forEach((header, index) => select.add(new Option(header.trim() || '열 ' + (index + 1), String(index))));
    select.value = String(headers.findIndex(header => aliases[id].includes(header.trim().toLowerCase().replace(/[\s_()°-]/g, ''))));
  }
  get('fields').hidden = false;
  get('search').value = '';
  redraw();
}
async function readFile(file) {
  if (!file) return;
  const current = ++request;
  try {
    const buffer = await file.arrayBuffer();
    if (current !== request) return;
    let content;
    try { content = new TextDecoder('utf-8', {fatal:true}).decode(buffer); }
    catch { content = new TextDecoder('euc-kr').decode(buffer); }
    load(content, file.name);
  } catch (error) {
    if (current === request) status(error.message, true);
  }
}
get('choose').onclick = () => get('file').click();
get('file').onchange = event => { readFile(event.target.files[0]); event.target.value = ''; };
get('example').onclick = () => {
  ++request;
  load('이름,위도,경도\n서울시청,37.5663,126.9779\n대전역,36.3327,127.4347\n해운대,35.1587,129.1604\n제주공항,33.5104,126.4914','예제 CSV');
};
get('drop').ondragover = event => { event.preventDefault(); get('drop').classList.add('over'); };
get('drop').ondragleave = () => get('drop').classList.remove('over');
get('drop').ondrop = event => { event.preventDefault(); get('drop').classList.remove('over'); readFile(event.dataTransfer.files[0]); };
get('search').oninput = listLocations;
get('fit').onclick = fit;
for (const id of ['lat','lng','name']) get(id).onchange = redraw;

function showFeatured() {
  ++request;

  get('search').value = '';

function drawFeatured() {
  layer?.clearLayers();

    const title = document.createElement('strong');
    const detail = document.createElement('div');

    detail.textContent = point.detail;
    popup.append(title, detail);
    const marker = layer ? L.circleMarker(point.coords, {

}
